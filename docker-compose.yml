services:
  station-loader:
    build:
      context: ./StationLoader
    volumes:
      - ./Data:/app/Data
    depends_on:
      mysql:
        condition: service_healthy
  
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Activity_monitoring_platform_Db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10