services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Activity_monitoring_platform_Db

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  station-loader:
    build:
      context: .
      dockerfile: StationLoader/Dockerfile

    depends_on:
      mysql:
        condition: service_healthy

    restart: "no"
  
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list > /dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  producer:
    build:
      context: ./Producer
      dockerfile: dockerfile
    volumes:
      - ./Data:/app/Data:ro
    depends_on:
      kafka:
        condition: service_healthy
      station-loader:
        condition: service_completed_successfully
    restart: "no"
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  raw-consumer:
    build:
      context: ./RawConsumer
      dockerfile: Dockerfile

    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy

    restart: unless-stopped

  analytics:
    build:
      context: "./AnalyticsService"
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017/
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:

